name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A manual run drives all 22 workouts in the PC suite (see `pc-sync`).
  workflow_dispatch:

# A newer push to the same pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The fast half — the same things `npm run check` and the pre-push hook run
  # locally. It used to sit IN FRONT of the test suite in one job; now it runs
  # beside it, so a lint, format or guard failure reports in about a minute
  # instead of waiting behind several minutes of tests.
  static:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # Node 24 matches the workstation toolchain.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      # The verifier and guard scripts: plain .mjs the root tsconfig never sees.
      - run: npm run typecheck:tools
      - run: npm run lint
      - run: npm run format:check
      - run: npm run guard:velocity-terminology
      - run: npm run guard:playlist-sample-rate

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # Node 24, unlike Node 20, ships `node:sqlite` — the storage suite runs
      # its migrations against a real in-memory SQLite instead of adding a
      # native dependency (§21).
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # The suite is about 190 files / 4 500 tests and the runner OOM'd at
      # Node's default ~2 GB heap ("Reached heap limit", exit 134) with the
      # main process at 2 040 MB — the results accumulating in the parent, not
      # a leak in any one test. Raise the ceiling and recycle workers that grow
      # past half a gig, so a suite that keeps growing degrades into a slower
      # run rather than a crash that looks like a test failure.
      - run: npm test -- --ci --colors --reporters=default --maxWorkers=2 --workerIdleMemoryLimit=512MB
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  # The PC version, end to end, in the runner's own Chrome: it builds the web
  # bundle, boots it, runs a workout on simulated punches, saves it, reloads,
  # and reads the saved database back (`tools/pc/app/README.md`). The only
  # test of the real WebAssembly engine and the browser's own storage.
  #
  # ADVISORY. It is deliberately NOT in the `ci` gate below. When this was
  # written it had never run on a runner, and how long the build would take
  # there was unknown (it copies about 760 MB of audio). Since then: it passed
  # on the last four runs looked at (2026-11-27), in about two and a half
  # minutes, build included. Add it to `needs` once that has held for a while
  # longer.
  pc-smoke:
    name: pc smoke (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # What makes it advisory in fact: the job still shows as failed, but the
    # run does not fail with it. Without this, leaving it out of `needs`
    # below would keep it out of the gate and still turn the run red.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run pc:smoke

  # The PC suite (`tools/pc/suite/README.md`): a workout driven in the
  # runner's own Chrome from the QA link the tablet suite uses, judged by the
  # tablet's correlator, its sound listened to in the page, and what it said
  # compared with the tablet's own captures. One workout on a push or a pull
  # request; all 22 on a manual run of this workflow.
  #
  # ADVISORY, like the smoke job. When this was written it had never run on
  # a runner, and two things were unknown there: whether a browser with no
  # sound card would start its audio at all, and how late a shared
  # four-processor machine would send clips.
  #
  # Its first two runs (2026-11-27, on the pull request that added it and on
  # `main` after the merge) answered both, once each: the audio started, all
  # 81 clips of the workout were heard, and the least gap before a ring was
  # 365 and 373 ms — against 376 on a 16-processor PC. Each run took just
  # under seven minutes.
  #
  # Two runs of one workout are not a baseline. So what is heard still only
  # warns here (`--sound-gate warn`) and the job stays out of the gate until
  # it has held for a while. If a runner ever will not start its audio, the
  # suite says the sound tap did not start, warns, and judges the rest. The
  # manual run of all 22 has not been tried.
  pc-sync:
    name: pc sync (advisory)
    runs-on: ubuntu-latest
    # A workout is five minutes of real time; all 22, two at a time, about an hour.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 150 || 30 }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Drive the PC suite
        run: npm run pc:suite -- --sound-gate warn ${{ github.event_name != 'workflow_dispatch' && '--only quick-one-two' || '' }}
      - name: Compare what it said with the tablet
        if: ${{ !cancelled() }}
        run: npm run pc:parity
      # The captures and reports, whatever the verdict: a failure here is
      # only worth anything if it can be read afterwards.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: pc-suite-run
          path: tools/pc/suite/runs/
          retention-days: 14

  # One stable name for "did CI pass", whatever the jobs above are called or
  # split into later. Runs even when one of them failed, so it reports a
  # failure rather than a skip.
  ci:
    name: ci
    needs: [static, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Both halves passed
        run: |
          echo "static checks: ${{ needs.static.result }}"
          echo "tests:         ${{ needs.test.result }}"
          test "${{ needs.static.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
